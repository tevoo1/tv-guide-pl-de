<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>TV-Programm PL / DE</title>
<style>
:root{color-scheme:dark;--bg:#0b1020;--panel:#121a2d;--panel2:#18233a;--line:#2b3854;--text:#f4f7ff;--muted:#a8b5ce;--accent:#70a5ff;--green:#4bd4a0}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font:14px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
header{padding:16px 12px 10px;position:sticky;top:0;background:rgba(11,16,32,.96);backdrop-filter:blur(12px);z-index:5;border-bottom:1px solid var(--line)}
h1{font-size:21px;margin:0 0 12px}.top,.country,.controls,.tools{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
button,select,input{font:inherit;color:var(--text);background:var(--panel2);border:1px solid var(--line);border-radius:10px;padding:10px 11px}
button{cursor:pointer}button.active{background:#274777;border-color:var(--accent)}button.primary{background:var(--accent);color:#081326;border-color:var(--accent);font-weight:700}
#now{margin-left:auto;color:var(--green);font-weight:700;font-variant-numeric:tabular-nums}
.controls{margin-top:9px}.controls input{flex:1;min-width:130px}.controls select{max-width:155px}
#status{color:var(--muted);font-size:12px;margin-top:8px}
main{padding:12px 10px 36px}.hint{color:var(--muted);font-size:12px;line-height:1.45;margin:0 0 10px}
.channel{display:grid;grid-template-columns:105px minmax(0,1fr);border:1px solid var(--line);border-radius:11px;overflow:hidden;margin-bottom:8px;background:var(--panel);min-height:88px}
.chname{padding:9px 7px;border-right:1px solid var(--line);display:flex;flex-direction:column;gap:6px;justify-content:center;font-size:12px;font-weight:700;overflow-wrap:anywhere}
.chname small{font-size:10px;color:var(--green);font-weight:500}
.programmes{position:relative;min-width:0;overflow-x:auto;overflow-y:hidden;scrollbar-width:thin}.blocks{display:flex;min-height:88px;position:relative}
.programme{position:relative;flex:0 0 auto;min-width:112px;padding:9px 8px 13px;border-right:1px solid var(--line);overflow:hidden;background:#16213a}
.programme:nth-child(even){background:#1a2742}.programme .time{font-size:10px;color:#b9c9e7;margin-bottom:6px;font-variant-numeric:tabular-nums}
.programme .name{font-size:11px;line-height:1.3;font-weight:600;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
.programme .progress{position:absolute;left:0;bottom:0;height:4px;background:var(--green);width:0}
.programme.current{background:#203b51;outline:1px solid #4bd4a0;outline-offset:-1px}
.nowline{position:absolute;top:0;bottom:0;width:2px;background:#ffcb6b;z-index:2;pointer-events:none}
.nowline:before{content:var(--line-label,"JETZT");position:absolute;top:0;left:3px;background:#ffcb6b;color:#161616;font-size:9px;font-weight:800;padding:2px 4px;border-radius:3px}
.empty{padding:24px 12px;text-align:center;color:var(--muted);border:1px dashed var(--line);border-radius:12px}
dialog{background:var(--panel);color:var(--text);border:1px solid var(--line);border-radius:16px;width:min(560px,94vw);max-height:85vh;padding:0}
dialog::backdrop{background:#0009}.modalhead{padding:14px;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;align-items:center}.modalbody{padding:12px 14px;overflow:auto;max-height:60vh}.modalfoot{padding:12px 14px;border-top:1px solid var(--line);display:flex;justify-content:space-between;align-items:center;gap:8px}
.channel-option{display:flex;gap:10px;align-items:center;padding:9px 0;border-bottom:1px solid #26324a}.channel-option input{width:18px;height:18px}
.small{color:var(--muted);font-size:12px}
@media(min-width:750px){.channel{grid-template-columns:155px minmax(0,1fr)}.chname{font-size:13px;padding:12px}}
</style>
</head>
<body>
<header>
 <div class="top"><h1>TV-Programm PL / DE</h1><span id="now">--:--</span></div>
 <div class="country"><button id="de" class="active" type="button">🇩🇪 Deutschland</button><button id="pl" type="button">🇵🇱 Polen</button><button id="choose" class="primary" type="button">Sender auswählen</button></div>
 <div class="controls"><select id="timeMode" aria-label="Uhrzeit"><option value="now">Jetzt</option><option value="20:15">20:15</option><option value="custom">Andere Zeit</option></select><input id="customTime" type="time" value="20:15" aria-label="Andere Uhrzeit" hidden><select id="day" aria-label="Tag"></select><input id="search" type="search" placeholder="Sender oder Sendung suchen …"></div>
 <div id="status">Programm wird geladen …</div>
</header>
<main><p class="hint">Die gelbe Linie zeigt die aktuelle Uhrzeit. Der grüne Balken zeigt den Fortschritt der laufenden Sendung.</p><div id="rows"></div></main>
<dialog id="picker">
 <div class="modalhead"><strong>Sender auswählen</strong><button id="close" type="button" aria-label="Schließen">✕</button></div>
 <div class="modalbody"><div class="tools"><button id="all" type="button">Alle auswählen</button><button id="none" type="button">Alle abwählen</button></div><p class="small">Die Auswahl wird für Polen und Deutschland getrennt gespeichert.</p><div id="options"></div></div>
 <div class="modalfoot"><span class="small" id="count"></span><button id="save" class="primary" type="button">Auswahl speichern</button></div>
</dialog>
<script>
(()=>{
const sources={pl:"data/epg-pl.xml",de:"data/epg-de.xml"};
const state={country:"de",channels:{pl:[],de:[]},programmes:{pl:[],de:[]},selected:{pl:null,de:null},loaded:{pl:false,de:false},checked:new Set()};
const $=id=>document.getElementById(id), pad=n=>String(n).padStart(2,"0");
const dateKey=d=>`${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;
const time=d=>`${pad(d.getHours())}:${pad(d.getMinutes())}`;
function parseDate(v){if(!v)return null;const m=v.match(/^(\d{4})(\d{2})(\d{2})(\d{2})(\d{2})(\d{2})\s*([+-]\d{4}|Z)?/);if(!m)return null;const base=`${m[1]}-${m[2]}-${m[3]}T${m[4]}:${m[5]}:${m[6]}`;if(!m[7]||m[7]==="Z")return new Date(base+(m[7]||"Z"));return new Date(`${base}${m[7].slice(0,3)}:${m[7].slice(3)}`)}
function parseXml(s){const x=new DOMParser().parseFromString(s,"text/xml");if(x.querySelector("parsererror"))throw Error("Ungültiges XMLTV-Format");const channels=[...x.querySelectorAll("channel")].map(c=>({id:c.getAttribute("id"),name:c.querySelector("display-name")?.textContent?.trim()||c.getAttribute("id")}));const programmes=[...x.querySelectorAll("programme")].map(p=>({channel:p.getAttribute("channel"),start:parseDate(p.getAttribute("start")),stop:parseDate(p.getAttribute("stop")),title:p.querySelector("title")?.textContent?.trim()||"Ohne Titel",desc:p.querySelector("desc")?.textContent?.trim()||""})).filter(p=>p.start&&p.stop&&p.stop>p.start);return{channels,programmes}}
function status(s){$("status").textContent=s}
async function load(c){if(state.loaded[c])return;status((c==="pl"?"Polnisches":"Deutsches")+" Programm wird geladen …");try{const r=await fetch(sources[c],{cache:"no-store"});if(!r.ok)throw Error("HTTP "+r.status);const d=parseXml(await r.text());state.channels[c]=d.channels;state.programmes[c]=d.programmes;state.loaded[c]=true;const saved=localStorage.getItem("tvguide-selected-"+c);state.selected[c]=saved?JSON.parse(saved):d.channels.map(x=>x.id);if(!state.selected[c].length&&d.channels.length)state.selected[c]=d.channels.map(x=>x.id);initDays();status(`${d.channels.length} Sender · ${d.programmes.length.toLocaleString("de-DE")} Sendungen`);render()}catch(e){status("Programm konnte nicht geladen werden: "+e.message);$("rows").innerHTML='<div class="empty">Programm konnte nicht geladen werden. Bitte Seite neu laden.</div>'}}
function initDays(){const s=$("day"),old=s.value;s.innerHTML="";for(let i=0;i<7;i++){const d=new Date();d.setHours(0,0,0,0);d.setDate(d.getDate()+i);const o=document.createElement("option");o.value=dateKey(d);o.textContent=i===0?"Heute":i===1?"Morgen":d.toLocaleDateString("de-DE",{weekday:"short",day:"2-digit",month:"2-digit"});s.append(o)}s.value=[...s.options].some(o=>o.value===old)?old:dateKey(new Date())}
function visibleChannels(){const q=$("search").value.trim().toLocaleLowerCase();const chosen=new Set(state.selected[state.country]||[]);return state.channels[state.country].filter(c=>chosen.has(c.id)&&(!q||c.name.toLocaleLowerCase().includes(q)||state.programmes[state.country].some(p=>p.channel===c.id&&p.title.toLocaleLowerCase().includes(q))))}
function selectedClock(){const mode=$("timeMode").value;if(mode==="now"){const n=new Date();return {hours:n.getHours(),minutes:n.getMinutes(),now:true}}const v=mode==="custom"?$("customTime").value:mode;if(!v)return {hours:20,minutes:15,now:false};const parts=v.split(":").map(Number);return {hours:parts[0]||0,minutes:parts[1]||0,now:false}}
function render(){if(!state.loaded[state.country])return;const rows=$("rows");rows.innerHTML="";const day=$("day").value||dateKey(new Date()),start=new Date(day+"T00:00:00"),end=new Date(start);end.setDate(end.getDate()+1);const now=new Date(),chs=visibleChannels(),ps=state.programmes[state.country];if(!chs.length){rows.innerHTML='<div class="empty">Keine Sender ausgewählt oder keine Suchtreffer. Bitte „Sender auswählen“ verwenden.</div>';return}
for(const ch of chs){const row=document.createElement("section");row.className="channel";const label=document.createElement("div");label.className="chname";label.append(document.createTextNode(ch.name));const small=document.createElement("small");small.textContent=ps.some(p=>p.channel===ch.id&&p.start<=now&&p.stop>now)?"● LIVE":"Programm";label.append(small);const wrap=document.createElement("div");wrap.className="programmes";const blocks=document.createElement("div");blocks.className="blocks";const list=ps.filter(p=>p.channel===ch.id&&p.stop>start&&p.start<end).sort((a,b)=>a.start-b.start);if(!list.length){const e=document.createElement("div");e.className="empty";e.textContent="Keine Programmdaten";blocks.append(e)}else{for(const p of list){const a=Math.max(p.start,start),b=Math.min(p.stop,end),minutes=Math.max(15,(b-a)/60000),item=document.createElement("div");item.className="programme";item.style.width=`${Math.max(112,minutes*2.2)}px`;if(p.start<=now&&p.stop>now)item.classList.add("current");const t=document.createElement("div");t.className="time";t.textContent=time(p.start)+"–"+time(p.stop);const title=document.createElement("div");title.className="name";title.textContent=p.title;title.title=p.desc||p.title;item.append(t,title);if(p.start<=now&&p.stop>now){const progress=document.createElement("div");progress.className="progress";progress.style.width=`${Math.max(0,Math.min(100,(now-p.start)/(p.stop-p.start)*100))}%`;item.append(progress)}blocks.append(item)}}wrap.append(blocks);const clock=selectedClock();if(day===dateKey(now)){const line=document.createElement("div");line.className="nowline";line.style.left=(clock.hours*60+clock.minutes)*2.2+"px";line.style.background=clock.now?"#ffcb6b":"#70a5ff";line.style.setProperty("--line-label",clock.now?'"JETZT"':`"${pad(clock.hours)}:${pad(clock.minutes)}"`);wrap.append(line)}row.append(label,wrap);rows.append(row)}
if(day===dateKey(now)){const clock=selectedClock();const offset=Math.max(0,(clock.hours*60+clock.minutes)*2.2-120);document.querySelectorAll(".programmes").forEach(el=>{if(!el.dataset.scrolled){el.scrollLeft=offset;el.dataset.scrolled="1"}})}
}
function chooseCountry(c){state.country=c;$("pl").classList.toggle("active",c==="pl");$("de").classList.toggle("active",c==="de");$("search").value="";initDays();load(c).then(()=>{if(state.loaded[c])render()})}
$("pl").onclick=()=>chooseCountry("pl");$("de").onclick=()=>chooseCountry("de");$("day").onchange=()=>{document.querySelectorAll(".programmes").forEach(e=>delete e.dataset.scrolled);render()};$("search").oninput=render;
$("timeMode").onchange=()=>{$("customTime").hidden=$("timeMode").value!=="custom";document.querySelectorAll(".programmes").forEach(e=>delete e.dataset.scrolled);render()};
$("customTime").onchange=()=>{document.querySelectorAll(".programmes").forEach(e=>delete e.dataset.scrolled);render()};
function picker(){state.checked=new Set(state.selected[state.country]||[]);const box=$("options");box.innerHTML="";for(const ch of state.channels[state.country]){const l=document.createElement("label");l.className="channel-option";const cb=document.createElement("input");cb.type="checkbox";cb.checked=state.checked.has(ch.id);cb.onchange=()=>{cb.checked?state.checked.add(ch.id):state.checked.delete(ch.id);count()};const s=document.createElement("span");s.textContent=ch.name;l.append(cb,s);box.append(l)}count();$("picker").showModal()}
function count(){$("count").textContent=`${state.checked.size} ausgewählt`}
$("choose").onclick=async()=>{await load(state.country);picker()};$("close").onclick=()=>$("picker").close();$("all").onclick=()=>{state.checked=new Set(state.channels[state.country].map(c=>c.id));$("options").querySelectorAll("input").forEach(x=>x.checked=true);count()};$("none").onclick=()=>{state.checked.clear();$("options").querySelectorAll("input").forEach(x=>x.checked=false);count()};$("save").onclick=()=>{state.selected[state.country]=[...state.checked];localStorage.setItem("tvguide-selected-"+state.country,JSON.stringify(state.selected[state.country]));$("picker").close();render()};
function tick(){const n=new Date();$("now").textContent=time(n);if(state.loaded[state.country]){document.querySelectorAll(".programmes").forEach(e=>delete e.dataset.scrolled);render()}}
initDays();tick();chooseCountry("de");setInterval(tick,60000);
})();
</script>
</body>
</html>
