<!doctype html>
<html lang="pl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#111827"><title>TV Guide PL / DE</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#0b1020;color:#f4f7ff;font:14px -apple-system,BlinkMacSystemFont,sans-serif}header{position:sticky;top:0;background:#0b1020ee;padding:12px;border-bottom:1px solid #293449;z-index:5}h1{font-size:19px;margin:0 0 10px}.bar{display:flex;gap:8px;flex-wrap:wrap}button,select,input{background:#121a2b;color:#fff;border:1px solid #293449;border-radius:9px;padding:9px}button.active{background:#1d4ed8}#status{color:#9ba9c2;font-size:12px;margin-top:8px}#wrap{height:calc(100dvh - 125px);overflow:auto}#timeline,.row{display:flex;min-width:max-content;border-bottom:1px solid #293449}.corner,.channel{position:sticky;left:0;width:150px;min-width:150px;background:#121a2b;border-right:1px solid #293449;padding:10px;z-index:2}.corner{top:0;z-index:4}.hours{display:flex;position:sticky;top:0;z-index:3;background:#121a2b}.hour{width:180px;min-width:180px;padding:10px;border-left:1px solid #293449}.channel{display:flex;gap:7px;align-items:center;min-height:66px}.channel[draggable=true]{cursor:grab}.grip{color:#8492aa}.programs{display:flex}.program{height:66px;flex:0 0 auto;overflow:hidden;padding:7px 9px;border-right:1px solid #293449;background:#172238}.program:nth-child(even){background:#1a2942}.program strong{font-size:12px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}.program small{display:block;color:#a8b8d2;margin-top:5px}.empty{padding:24px;color:#9ba9c2}@media(min-width:800px){.corner,.channel{width:190px;min-width:190px}}
</style></head><body><header><h1>TV Guide</h1><div class="bar"><button id="pl" class="active">🇵🇱 Polska</button><button id="de">🇩🇪 Niemcy</button><button id="now">Teraz</button><select id="day"></select><input id="search" placeholder="Szukaj kanału…"></div><div id="status">Ładowanie danych…</div></header><div id="wrap"><div id="timeline"><div class="corner">Kanał · przeciągnij ↕</div><div class="hours" id="hours"></div></div><div id="rows"><div class="empty">Pobieranie programu…</div></div></div>
<script>
const files={pl:"data/epg-pl.xml",de:"data/epg-de.xml"};let country="pl",channels=[],shows=[],ready=false;
const $=x=>document.getElementById(x), key=d=>`${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,"0")}-${String(d.getDate()).padStart(2,"0")}`;
function date(s){let m=s.match(/^(\d{4})(\d{2})(\d{2})(\d{2})(\d{2})(\d{2})?\s*([+-]\d{4})?/);if(!m)return null;let z=m[7]?m[7].slice(0,3)+":"+m[7].slice(3):"Z";let d=new Date(`${m[1]}-${m[2]}-${m[3]}T${m[4]}:${m[5]}:${m[6]||"00"}${z}`);return isNaN(+d)?null:d}
function child(e,t){return e.getElementsByTagName(t)[0]?.textContent?.trim()||""}
function initDays(){for(let i=0;i<7;i++){let d=new Date();d.setDate(d.getDate()+i);let o=document.createElement("option");o.value=key(d);o.textContent=i===0?"Dzisiaj":i===1?"Jutro":d.toLocaleDateString("pl-PL",{weekday:"short",day:"2-digit",month:"2-digit"});$("day").append(o)}$("day").value=key(new Date())}
async function load(){ready=false;$("status").textContent="Pobieranie EPG…";$("rows").innerHTML='<div class="empty">Pobieranie programu…</div>';try{let r=await fetch(files[country],{cache:"no-store"});if(!r.ok)throw Error("HTTP "+r.status);let x=new DOMParser().parseFromString(await r.text(),"application/xml");if(x.querySelector("parsererror"))throw Error("Nieprawidłowy XML");channels=[...x.querySelectorAll("channel")].map(c=>({id:c.getAttribute("id"),name:child(c,"display-name")||c.getAttribute("id")})).filter(c=>c.id);shows=[...x.querySelectorAll("programme")].map(p=>({id:p.getAttribute("channel"),start:date(p.getAttribute("start")||""),stop:date(p.getAttribute("stop")||""),title:child(p,"title"),desc:child(p,"desc")})).filter(p=>p.start&&p.stop&&p.title);let ids=new Set(shows.map(s=>s.id));channels=channels.filter(c=>ids.has(c.id));let saved=JSON.parse(localStorage.getItem("order-"+country)||"[]");channels.sort((a,b)=>{let i=saved.indexOf(a.id),j=saved.indexOf(b.id);return(i<0?1e6:i)-(j<0?1e6:j)||a.name.localeCompare(b.name)});ready=true;$("status").textContent=`${channels.length} kanałów · ${shows.length.toLocaleString("pl-PL")} audycji`;render()}catch(e){$("status").textContent="Nie udało się pobrać EPG: "+e.message;$("rows").innerHTML='<div class="empty">Źródło może być niedostępne lub nie pozwalać na pobieranie. Sprawdź po publikacji.</div>';console.error(e)}}
function render(){if(!ready)return;let start=new Date($("day").value+"T00:00:00"),end=new Date(start);end.setDate(end.getDate()+1);$("hours").innerHTML="";for(let h=0;h<24;h++){let e=document.createElement("div");e.className="hour";e.textContent=String(h).padStart(2,"0")+":00";$("hours").append(e)}let q=$("search").value.toLowerCase(),out=$("rows");out.innerHTML="";let visible=channels.filter(c=>c.name.toLowerCase().includes(q)||c.id.toLowerCase().includes(q));for(let c of visible){let row=document.createElement("div");row.className="row";let label=document.createElement("div");label.className="channel";label.draggable=true;label.dataset.id=c.id;label.innerHTML='<span class="grip">⠿</span><span></span>';label.lastChild.textContent=c.name;label.ondragstart=e=>e.dataTransfer.setData("text/plain",c.id);label.ondragover=e=>e.preventDefault();label.ondrop=e=>{e.preventDefault();let from=e.dataTransfer.getData("text/plain"),ids=channels.map(x=>x.id),a=ids.indexOf(from),b=ids.indexOf(c.id);if(a<0||b<0)return;ids.splice(a,1);ids.splice(b,0,from);channels.sort((x,y)=>ids.indexOf(x.id)-ids.indexOf(y.id));localStorage.setItem("order-"+country,JSON.stringify(ids));render()};row.append(label);let lane=document.createElement("div");lane.className="programs";let items=shows.filter(s=>s.id===c.id&&s.stop>start&&s.start<end).sort((a,b)=>a.start-b.start);let cursor=+start;for(let s of items){let a=Math.max(+s.start,+start),b=Math.min(+s.stop,+end);if(b<=a)continue;if(a>cursor){let gap=document.createElement("div");gap.className="program";gap.style.width=gap.style.flex=`0 0 ${(a-cursor)/3600000*180}px`;lane.append(gap)}let p=document.createElement("div"),w=Math.max(70,(b-a)/3600000*180);p.className="program";p.style.width=p.style.flex=`0 0 ${w}px`;let title=document.createElement("strong");title.textContent=s.title;let time=document.createElement("small");time.textContent=s.start.toLocaleTimeString("pl-PL",{hour:"2-digit",minute:"2-digit"})+"–"+s.stop.toLocaleTimeString("pl-PL",{hour:"2-digit",minute:"2-digit"});p.append(title,time);p.title=s.desc;lane.append(p);cursor=Math.max(cursor,b)}if(cursor<+end){let gap=document.createElement("div");gap.className="program";gap.style.flex=`0 0 ${(+end-cursor)/3600000*180}px`;lane.append(gap)}row.append(lane);out.append(row)}if(!visible.length)out.innerHTML='<div class="empty">Brak kanałów.</div>'}
$("pl").onclick=()=>{country="pl";$("pl").classList.add("active");$("de").classList.remove("active");load()};$("de").onclick=()=>{country="de";$("de").classList.add("active");$("pl").classList.remove("active");load()};$("day").onchange=render;$("search").oninput=render;$("now").onclick=()=>{let d=new Date();$("day").value=key(d);render();$("wrap").scrollLeft=(d.getHours()+d.getMinutes()/60)*180};initDays();load();
</script></body></html>
