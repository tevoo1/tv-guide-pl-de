name: Update TV guide and deploy
on:
  workflow_dispatch:
  schedule:
    - cron: "17 4 * * *"
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Download EPG files
        run: |
          mkdir -p public/data
          curl -fL --retry 3 --retry-delay 5 "https://iptv-epg.org/files/epg-pl.xml" -o public/data/epg-pl.xml
          curl -fL --retry 3 --retry-delay 5 "https://iptv-epg.org/files/epg-de.xml" -o public/data/epg-de.xml
          test -s public/data/epg-pl.xml
          test -s public/data/epg-de.xml
      - name: Copy app
        run: cp "$GITHUB_WORKSPACE/index.html" public/index.html
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: public
      - uses: actions/deploy-pages@v4
